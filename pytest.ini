[pytest]
addopts = -q -ra
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    error
    # Ignore pydantic deprecation warnings caused by v2 transition
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    # Ignore general DeprecationWarnings from third-party libs we can't fix immediately
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*U.*mode is deprecated:DeprecationWarning
    # Ignore SQLAlchemy 2.0 migration notice class if present
    ignore::sqlalchemy.exc.MovedIn20Warning
python_files = tests.py test_*.py *_tests.py
testpaths = backend/tests

# Show local test durations
# Note: removed 'durations' and 'console_output_style' for compatibility with older pytest versions
